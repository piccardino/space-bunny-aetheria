name: Deploy to GitHub Pages

# Re-runs the deploy on its own, and lets a manual dispatch rescue a failed run
# from the Actions tab without pushing a no-op commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions, narrowed to what the Pages actions actually need.
# `contents: read` is required to check out the repo at all.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A second push cancels the in-flight one instead of
# racing it, so the live site never briefly serves a half-uploaded build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The one non-obvious step. A GitHub Pages *project* site is served from
      # /<repo>/, not the domain root, so a build with base "/" emits asset
      # URLs like /assets/index-abc.js. The browser then asks for
      #   https://<user>.github.io/assets/index-abc.js
      # which is the wrong site entirely -> 404 -> blank page.
      # vite.config.js reads BASE_PATH and uses it as `base`, and the app
      # derives every other URL from import.meta.env.BASE_URL.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Uploads dist/ as an artifact; the deploy job publishes it. The 404.html
      # SPA fallback and .nojekyll are written by the spaFallback build plugin.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
